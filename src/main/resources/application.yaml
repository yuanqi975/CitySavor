server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6380
    password:
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        spring.json.add.type.headers: false
    consumer:
      group-id: ${VOUCHER_ORDER_CONSUMER_GROUP:voucher-order-group}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.hmdp.entity
        spring.json.value.default.type: com.hmdp.entity.VoucherOrder
        spring.json.use.type.headers: false
    listener:
      ack-mode: manual_immediate
      concurrency: 3
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
  pattern:
    dateformat: mm:ss.SSS
ai:
  enabled: ${AI_ENABLED:false}
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:}
  timeout-ms: ${AI_TIMEOUT_MS:30000}
hmdp:
  kafka:
    voucher-order-topic: ${VOUCHER_ORDER_TOPIC:voucher-order-topic}
    voucher-order-dlt-topic: ${VOUCHER_ORDER_DLT_TOPIC:voucher-order-topic.DLT}
    voucher-order-dlt-group: ${VOUCHER_ORDER_DLT_GROUP:voucher-order-dlt-group}
    send-timeout-seconds: ${VOUCHER_ORDER_SEND_TIMEOUT_SECONDS:12}
